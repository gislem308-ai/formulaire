<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire Complet</title>
    <style>
        :root {
            --rose: #ff4d8d;
            --rouge: #ff3b5c;
            --bleu: #2563eb;
            --vert: #10b981;
            --bg-1: #fff0f6;
            --bg-2: #eff6ff;
            --bg-3: #ecfdf5;
            --texte: #1e293b;
            --bordure: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            padding: 36px 16px;
            color: var(--texte);
            background: linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 52%, var(--bg-3) 100%);
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .form-card {
            width: 100%;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 22px;
            overflow: hidden;
            box-shadow: 0 20px 45px rgba(37, 99, 235, 0.12), 0 6px 16px rgba(255, 77, 141, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        .form-header {
            padding: 26px 28px;
            background: linear-gradient(120deg, var(--rouge), var(--rose) 48%, var(--bleu));
            color: #ffffff;
        }

        .badge {
            display: inline-block;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.4px;
            padding: 4px 12px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.22);
            margin-bottom: 10px;
        }

        .form-header h1 {
            font-size: 24px;
            margin-bottom: 6px;
        }

        .form-header p {
            font-size: 14px;
            opacity: 0.95;
        }

        form {
            padding: 26px 28px 30px;
        }

        .section-title {
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--bleu);
            margin: 18px 0 12px;
            padding-bottom: 6px;
            border-bottom: 2px solid #fce7f3;
        }

        .section-title:first-of-type {
            margin-top: 0;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
        }

        .field {
            margin-bottom: 14px;
        }

        label.label-main {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--texte);
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 11px 14px;
            font-size: 14px;
            font-family: inherit;
            color: var(--texte);
            background: #f8fafc;
            border: 1.5px solid var(--bordure);
            border-radius: 12px;
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus,
        select:focus,
        textarea:focus {
            background: #ffffff;
            border-color: var(--rose);
            box-shadow: 0 0 0 4px rgba(255, 77, 141, 0.16);
            transform: translateY(-1px);
        }

        textarea {
            resize: vertical;
            min-height: 95px;
        }

        .options-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 14px;
        }

        .option-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 9px 14px;
            border-radius: 999px;
            border: 1.5px solid var(--bordure);
            background: #ffffff;
            font-size: 13.5px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-pill:hover {
            border-color: var(--rose);
            background: #fff5f8;
        }

        .option-pill input {
            accent-color: var(--rose);
            cursor: pointer;
            transform: scale(1.08);
        }

        .submit-btn {
            width: 100%;
            margin-top: 10px;
            padding: 13px 18px;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
            cursor: pointer;
            background: linear-gradient(135deg, var(--rouge), var(--rose), var(--bleu));
            background-size: 180% 180%;
            box-shadow: 0 10px 22px rgba(255, 59, 92, 0.28);
            transition: all 0.25s ease;
        }

        .submit-btn:hover {
            background-position: right center;
            transform: translateY(-2px);
            box-shadow: 0 14px 26px rgba(37, 99, 235, 0.28);
        }

        .submit-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        #status-msg {
            margin-top: 14px;
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            display: none;
        }

        #status-msg.success {
            display: block;
            background: #d1fae5;
            color: #065f46;
            border: 1px solid var(--vert);
        }

        #status-msg.error {
            display: block;
            background: #ffe4e6;
            color: #9f1239;
            border: 1px solid var(--rouge);
        }

        @media (max-width: 560px) {
            .grid-2 {
                grid-template-columns: 1fr;
            }

            .form-header,
            form {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="form-card">
        <div class="form-header">
            <span class="badge">✨ Formulaire Interactif</span>
            <h1>saisir vos cordonnées</h1>
        </div>

        <form id="custom-form" action="https://api.web3forms.com/submit" method="POST">
            <input type="hidden" name="access_key" value="dcc78f0f-b3b6-4320-ab19-10431273bf4c">
            <input type="hidden" name="subject" value="Nouvelle réponse formulaire">

            <div class="section-title">1. Informations Personnelles</div>

            <div class="grid-2">
                <div class="field">
                    <label class="label-main" for="nom">Nom & Prénom *</label>
                    <input type="text" id="nom" name="nom" placeholder="EX: FOULEN BEN FALTEN" required>
                </div>
                <div class="field">
                    <label class="label-main" for="date_naissance">Date de naissance</label>
                    <input type="date" id="date_naissance" name="date_naissance">
                </div>
            </div>

            <div class="grid-2">
                <div class="field">
                    <label class="label-main" for="email">Adresse Email *</label>
                    <input type="email" id="email" name="email" placeholder="exemple@mail.com" required>
                </div>
                <div class="field">
                    <label class="label-main" for="telephone">Numéro de téléphone *</label>
                    <input type="tel" id="telephone" name="telephone" placeholder="+216 XX XXX XXX" required>
                </div>
            </div>

            <div class="section-title">2. Choix & Préférences</div>

            <div class="field">
                <label class="label-main" for="categorie">Catégorie / Domaine *</label>
                <select id="categorie" name="categorie" required>
                    <option value="" selected disabled>-- choisis une option --</option>
                    <option value="Web & Code">Web & Code</option>
                    <option value="Design & UI">Design & UI</option>
                    <option value="Gaming & Créations">Gaming & Créations</option>
                    <option value="Autre">Autre</option>
                </select>
            </div>

            <div class="field">
                <label class="label-main">Type de demande</label>
                <div class="options-group">
                    <label class="option-pill">
                        <input type="radio" name="type_demande" value="Question" checked>
                        <span>Question</span>
                    </label>
                    <label class="option-pill">
                        <input type="radio" name="type_demande" value="Collaboration">
                        <span>Collaboration</span>
                    </label>
                    <label class="option-pill">
                        <input type="radio" name="type_demande" value="Inscription">
                        <span>Inscription</span>
                    </label>
                </div>
            </div>

            <div class="field">
                <label class="label-main">Centres d'intérêt</label>
                <div class="options-group">
                    <label class="option-pill">
                        <input type="checkbox" name="interets" value="HTML/CSS/JS">
                        <span>HTML / CSS / JS</span>
                    </label>
                    <label class="option-pill">
                        <input type="checkbox" name="interets" value="Python">
                        <span>Python</span>
                    </label>
                    <label class="option-pill">
                        <input type="checkbox" name="interets" value="Football">
                        <span>Football</span>
                    </label>
                    <label class="option-pill">
                        <input type="checkbox" name="interets" value="Jeux">
                        <span>Jeux</span>
                    </label>
                </div>
            </div>

            <div class="section-title">3. Message Supplémentaire</div>

            <div class="field">
                <label class="label-main" for="message">Message</label>
                <textarea id="message" name="message" placeholder="Ekteb ay haja t7eb tzidha hné..."></textarea>
            </div>

            <button type="submit" class="submit-btn" id="submit-btn">Envoyer la Réponse</button>
            <div id="status-msg"></div>
        </form>
    </div>

    <script>
        const form = document.getElementById("custom-form");
        const submitBtn = document.getElementById("submit-btn");
        const statusMsg = document.getElementById("status-msg");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            // Njam3ou les cases à cocher elli t5atrou f nafes name
            const checkedInterets = Array.from(
                form.querySelectorAll('input[name="interets"]:checked')
            ).map((el) => el.value);

            const formData = new FormData(form);
            formData.delete("interets");
            formData.append("interets", checkedInterets.length ? checkedInterets.join(", ") : "Aucun");

            submitBtn.disabled = true;
            submitBtn.textContent = "Jari l'envoi...";
            statusMsg.className = "";
            statusMsg.style.display = "none";

            try {
                const res = await fetch(form.action, {
                    method: "POST",
                    body: formData
                });
                const data = await res.json();

                if (data.success) {
                    statusMsg.textContent = "✅ Ya3tik sa7a! L'ma3loumet woslouni b najé7.";
                    statusMsg.className = "success";
                    form.reset();
                } else {
                    throw new Error(data.message || "Erreur");
                }
            } catch (err) {
                statusMsg.textContent = "❌ Sar mochkel wa9t l'envoi. Véréfii l'Access Key w 3awed jarreb.";
                statusMsg.className = "error";
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = "Envoyer la Réponse";
            }
        });
    </script>

</body>

</html>
